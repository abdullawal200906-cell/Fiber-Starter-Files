<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fiber — Create Account</title>
    <link rel="stylesheet" href="lol.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="form-panel">
        <h3 class="brand">Fiber</h3>
        <h1>Create your Fiber account</h1>

        <div class="input-group">
          <label for="name">Your Name</label>
          <input id="name" type="text" placeholder="john doe" />
        </div>

        <div class="input-group">
          <label for="email">Your Email</label>
          <input id="email" type="email" placeholder="john@example.com" />
        </div>

        <div class="input-group">
          <label for="password">Your Password</label>
          <input id="password" type="password" placeholder="At least 8 characters" />
        </div>

        <div class="terms">
          <input type="checkbox" id="terms" />
          <label for="terms">
            By creating an account on Fiber, you agree to the
            <a href="#">Terms &amp; Conditions</a>
          </label>
        </div>

        <button type="button" class="submit-btn">Create Fiber Account</button>

        <p class="signin-text">
          Already have an account? <a href="#">Sign in</a>
        </p>
      </section>

      <aside class="promo-panel" aria-label="Fiber template showcase">
        <div class="promo-card">
          <img src="Design/Sign Up Image.png" alt="Fiber portfolio preview" />
        </div>
        <div class="promo-copy">
          <h2>Unparalleled Templates</h2>
          <p>Crafted by a team of professional designers, our templates are</p>
          <p>unparalleled in the market.</p>
        </div>
      </aside>
    </main>
  </body>
</html>

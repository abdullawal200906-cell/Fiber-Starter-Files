<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="float.css">
</head>
<body>

    <div class="container">
        <div class="left">
            <h3 class="logo">Fiber</h3>
            <h1>Create your Fiber account</h1>

            <div class="input-container">
                <label for="name">Your Name</label>
                <input type="text" id="name" placeholder="john doe">
            </div>

            <div class="input-container">
                <label for="email">Your Email</label>
                <input type="email" id="email" placeholder="john@example.com">
            </div>

            <div class="input-container">
                <label for="password">Your Password</label>
                <input type="password" id="password" placeholder="At least 8 characters">
            </div>

            <div class="terms">
                <input type="checkbox" id="terms">
                <label for="terms">By creating an account on Fiber, you agree to the
                    <a href="#">Terms and conditions</a>
                </label>
            </div>

            <button class="submit-btn">Create Fiber Account</button>
            <p class="signin-text">Already have an account? <a href="#">Sign in</a></p>
        </div>

        <div class="right">
            <div class="card">
                
                <img src="Sign Up Image.png" alt="Card Image">
                
            </div>
            <div class="omo">
            <h2>Unparalleled Templates</h2>
            <p>Crafted by a team of professional designers, our</p>
            <p>templates are unparalleled in the market.</p>
            
        </div>
    </div>
    </div>
</body>
</html>
